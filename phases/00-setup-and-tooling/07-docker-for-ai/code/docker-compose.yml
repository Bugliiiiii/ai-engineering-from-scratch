services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../../../:/workspace
      - ../../../models:/models
      - ../../../datasets:/data
    ports:
      - "8888:8888"
      - "5000:5000"
    stdin_open: true
    tty: true
    command: python /workspace/phases/00-setup-and-tooling/07-docker-for-ai/code/server.py

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
